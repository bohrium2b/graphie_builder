<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graphie Builder Preview</title>
  <link rel="stylesheet" href="runtime/css/graphie-to-png.css" />
  <link rel="stylesheet" href="runtime/css/font-awesome-font.css" />
  <style>
     html, body {
       margin: 0;
       padding: 0;
       width: 100%;
       height: 100%;
       background: #ffffff;
       overflow: auto;
     }
     #graphie-host {
       position: relative;
       min-width: 100%;
       min-height: 100%;
       display: flex;
       align-items: center;
       justify-content: center;
       transform-origin: 0 0;
     }
     .graphie {
       background: #ffffff;
     }
    .graphie {
      background: #ffffff;
    }
    .graphie-label {
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .error {
      color: #d32f2f;
      font-family: Menlo, Courier, monospace;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="graphie-host">
    <div class="graphie"></div>
  </div>

  <!-- Shims expected by Khan Exercises AMD modules -->
  <script>
    // DEBUG: enable tracing of the math/label pipeline.
    window.__graphieLog = false;
    window.__texLog = false;
    window.__satoriDebug = true;
    var KhanUtil = { debugLog: function() {} };
    var Khan = {
      Util: KhanUtil,
      query: { debug: "" },
      scratchpad: { disable: function() {} },
      error: function() {}
    };
    var Perseus = {};
    var Exercises = {
      localMode: true,
      useKatex: true,
      khanExercisesUrlBase: "../",
      getCurrentFramework: function() { return "khan-exercises"; },
      PerseusBridge: { cleanupProblem: function() {} }
    };
    if (typeof Object.assign !== "function") {
      (function () {
        Object.assign = function (target) {
          "use strict";
          if (target === undefined || target === null) {
            throw new TypeError("Cannot convert undefined or null to object");
          }
          var output = Object(target);
          for (var index = 1; index < arguments.length; index++) {
            var source = arguments[index];
            if (source !== undefined && source !== null) {
              for (var nextKey in source) {
                if (source.hasOwnProperty(nextKey)) {
                  output[nextKey] = source[nextKey];
                }
              }
            }
          }
          return output;
        };
      })();
    }
    window.webkit2png = window.webkit2png || { start: function() {}, stop: function() {} };
    window.callPhantom = window.callPhantom || function() {};
    window.i18n = { _: function(s) { return s; } };
  </script>

  <!-- Open-source MathJax v3 (SVG output) + KaTeX-compatible adapter.
       The adapter loads the MathJax bundle on demand. -->
  <script src="runtime/js/mathjax-adapter.js"></script>

  <!-- KaTeX (vendored, used by tex.js as the primary math renderer) -->
  <link rel="stylesheet" href="runtime/js/katex/katex.css" />
  <script src="runtime/js/katex/katex.js"></script>

  <!-- Third-party libs required by graphie -->
  <script src="runtime/js/jquery.js"></script>
  <!-- i18n (window.$_) and ICU locale data (window.icu) must be globals
       before the AMD modules evaluate: graphie-helpers-arithmetic.js reads
       icu.getDecimalFormatSymbols() at module-load time. -->
  <script src="runtime/js/i18n.js"></script>
  <script src="runtime/js/localeplanet/icu.en.js"></script>
  <script src="runtime/js/underscore.js"></script>
  <script>
    // Expose i18n._ on jQuery for Khan Exercises AMD modules (math.js, math-format.js)
    if (window.jQuery && window.i18n) {
      window.jQuery._ = window.i18n._;
    }
  </script>
  <script src="runtime/js/require.js"></script>
  <script src="runtime/js/exercises-stub.js"></script>
  <script>Exercises.useKatex = true;</script>

  <!-- Image library + Perseus util (used by setup templates) -->
  <script src="runtime/js/image-library.js"></script>
  <script src="runtime/js/util.js"></script>

  <script>
    // Require.js module loader for the Khan Exercises graphie runtime.
    // The AMD modules use relative requires (e.g. require("./kpoint.js"))
    // which resolve relative to each module's own URL, so no path
    // mapping is needed here.
    require.config({
      baseUrl: ""
    });

    require([
      "runtime/js/tmpl.js",
      "runtime/js/tex.js",
      "runtime/js/knumber.js",
      "runtime/js/kvector.js",
      "runtime/js/kmatrix.js",
      "runtime/js/kpoint.js",
      "runtime/js/kline.js",
      "runtime/js/math.js",
      "runtime/js/math-format.js",
      "runtime/js/graphie.js",
      "runtime/js/angles.js",
      "runtime/js/expressions.js",
      "runtime/js/graphie-geometry.js",
      "runtime/js/graphie-polygon.js",
      "runtime/js/graphie-helpers.js",
      "runtime/js/graphie-helpers-arithmetic.js",
      "runtime/js/word-problems.js",
      "runtime/js/interactive.js",
      "runtime/js/graphie-drawing.js",
      "runtime/js/graphie-3d.js",
      "runtime/js/time.js"
    ], function () {
      // Backward-compat shim used by some templates.
      if (KhanUtil && KhanUtil.kline) {
        KhanUtil.lineMidpoint = KhanUtil.kline.midpoint;
      }

      // Post a message to the parent (React) window.
      function postToParent(payload) {
        try {
          if (window.parent && window.parent !== window) {
            // Opaque origins (file://, some custom schemes) serialise to
            // "null"; posting to "null" silently drops the message, so use
            // the wildcard there.
            var origin = window.location.origin;
            var target = !origin || origin === "null" ? "*" : origin;
            window.parent.postMessage(payload, target);
          }
        } catch (e) {
          // Cross-origin parent: fall back to wildcard.
          try { window.parent.postMessage(payload, "*"); } catch (e2) {}
        }
      }

             // View transform state for zoom/pan applied directly to #graphie-host.
       var __viewScale = 1;
       var __viewTx = 0;
       var __viewTy = 0;
       function applyViewTransform() {
         var host = document.getElementById("graphie-host");
         if (!host) return;
         host.style.transform = "translate(" + __viewTx + "px," + __viewTy + "px) scale(" + __viewScale + ")";
       }
       window.setZoom = function (z) { __viewScale = Math.max(0.1, (z || 100) / 100); applyViewTransform(); };
       window.pan = function (dx, dy) { __viewTx += dx || 0; __viewTy += dy || 0; applyViewTransform(); };
       window.resetView = function () { __viewScale = 1; __viewTx = 0; __viewTy = 0; applyViewTransform(); }; 
      // graphie-to-png editor's `updateGraphie()`: clear prior state, set the
      // code as the container's text, then invoke the AMD plugin.
      window.runGraphie = function (code) {
        var $graphie = $(".graphie");
        // Reset state so re-renders don't accumulate.
        $graphie.data("graphie", null).removeClass("error").empty();
        try {
          // $.fn.graphie() reads the element's text content as the code.
          $graphie.text(code || "");
          $graphie.graphie();
           // Read the graphie's coordinate layout (range/scale) so the parent
           // can map mouse coords between canvas pixels and Graphie units.
           var g = $graphie.data("graphie");
           if (g && g.range && g.scale) {
             var host = document.getElementById("graphie-host");
             var w = (host && host.offsetWidth) || 0;
             var h = (host && host.offsetHeight) || 0;
             postToParent({
               type: "graphie:layout",
               range: [g.range[0], g.range[1]],
               scale: Array.isArray(g.scale) ? g.scale : [g.scale, g.scale],
               width: w,
               height: h,
             });
           }
          // Wait for MathJax labels to actually render (they're async)
          whenLabelsSettled(function () {
            postToParent({ type: "graphie:rendered" });
          });
        } catch (e) {
          var msg = (e && e.message) ? e.message : String(e);
          $graphie.addClass("error").text(msg);
          if (window.console) { console.log(e.stack || msg); }
          postToParent({ type: "graphie:error", message: msg });
        }
      };

      // Poll until every label's SVG contains glyphs (path elements),
      // indicating MathJax has finished typesetting.
      function labelsSettled() {
        var svgs = document.querySelectorAll(".graphie-label svg");
        for (var i = 0; i < svgs.length; i++) {
          if (!svgs[i].querySelector("path")) return false;
        }
        return true;
      }
      function whenLabelsSettled(cb, tries) {
        if (labelsSettled() || (tries || 0) > 120) return cb();
        requestAnimationFrame(function () { whenLabelsSettled(cb, (tries || 0) + 1); });
      }

      // Extract the rendered SVG as a string, with a viewBox set from the
      // SVG's width/height. Uses nested SVG for MathJax labels (preserves
      // their viewBox/coords) and converts plain-text labels to <text>.
      window.getSVG = function () {
        var errorSVG = '<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="300" height="100"><text x="10" y="20" fill="red" font-weight="bold">Error rendering</text></svg>';
        var svgNode = $(".graphie > svg")[0];
        if (!svgNode) {
          return errorSVG;
        }
        var width = parseFloat(svgNode.getAttribute("width"));
        var height = parseFloat(svgNode.getAttribute("height"));
        if (!isFinite(width) || !isFinite(height)) {
          var br = svgNode.getBoundingClientRect();
          width = br.width; height = br.height;
        }

        // Create a fresh output SVG
        var NS = "http://www.w3.org/2000/svg";
        var out = document.createElementNS(NS, "svg");
        out.setAttribute("width", width);
        out.setAttribute("height", height);
        out.setAttribute("viewBox", "0 0 " + width + " " + height);
        out.setAttribute("version", "1.1");
        out.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");

        // 1) Copy the Raphaël drawing (children of the original SVG)
        var raphaelChildren = svgNode.childNodes;
        for (var i = 0; i < raphaelChildren.length; i++) {
          var child = raphaelChildren[i];
          if (child.nodeType === 1) { // Element node
            out.appendChild(child.cloneNode(true));
          }
        }

        // 2) Convert labels: MathJax → nested <svg>, plain text → <text>
        var labels = document.querySelectorAll(".graphie > .graphie-label");
        var graphieHost = document.querySelector(".graphie");
        var graphieRect = graphieHost ? graphieHost.getBoundingClientRect() : null;

        // Handle responsive scaling if the container is scaled
        var sx = 1, sy = 1;
        if (graphieRect) {
          sx = graphieRect.width / width || 1;
          sy = graphieRect.height / height || 1;
        }

        for (var i = 0; i < labels.length; i++) {
          var label = labels[i];
          var $label = $(label);

          // Get label's computed style for color, font, etc.
          var cs = window.getComputedStyle(label);
          // Robust color extraction: some labels have fill-opacity:0 / fill:none
          // which shouldn't affect 'color' but sometimes do in weird browser states.
          var color = cs.color;
          // Also check the label's own style attribute for explicit color
          var styleColor = label.style.color;
          if (styleColor && styleColor !== "rgba(0, 0, 0, 0)" && styleColor !== "transparent") {
            color = styleColor;
          }
          if (!color || color === "rgba(0, 0, 0, 0)" || color === "transparent") {
            // Try parent's color as fallback
            var parent = label.parentElement;
            if (parent) {
              var parentCs = window.getComputedStyle(parent);
              if (parentCs.color && parentCs.color !== "rgba(0, 0, 0, 0)" && parentCs.color !== "transparent") {
                color = parentCs.color;
              }
            }
          }
          if (!color || color === "rgba(0, 0, 0, 0)" || color === "transparent") {
            color = "#000000";
          }

          // Find MathJax SVG inside the label
          var mjxSvg = label.querySelector("mjx-container > svg");
          if (!mjxSvg) {
            mjxSvg = label.querySelector("svg");
          }

          if (mjxSvg && mjxSvg.querySelector("path")) {  // rendered math only
            // Use the MathJax SVG's own rendered pixel rect
            var r = mjxSvg.getBoundingClientRect();
            // Fallback: if rect is 0/NaN (not laid out), estimate from label CSS + viewBox
            if (!isFinite(r.width) || r.width === 0 || !isFinite(r.height) || r.height === 0) {
              var labelRect = label.getBoundingClientRect();
              r = labelRect;
            }
            var nested = document.createElementNS(NS, "svg");
            var x = (r.left - graphieRect.left) / sx;
            var y = (r.top - graphieRect.top) / sy;
            var w = r.width / sx;
            var h = r.height / sy;
            // Ensure non-zero dimensions
            if (!isFinite(w) || w === 0) w = 10;
            if (!isFinite(h) || h === 0) h = 10;
            nested.setAttribute("x", x);
            nested.setAttribute("y", y);
            nested.setAttribute("width", w);
            nested.setAttribute("height", h);
            var vb = mjxSvg.getAttribute("viewBox");
            if (vb) nested.setAttribute("viewBox", vb);
            // Copy all children (defs + glyph groups) from the MathJax SVG
            var children = mjxSvg.childNodes;
            for (var j = 0; j < children.length; j++) {
              var child = children[j];
              if (child.nodeType === 1) {
                nested.appendChild(child.cloneNode(true));
              }
            }
            // Bake currentColor → actual color
            var fillNodes = nested.querySelectorAll('[fill="currentColor"]');
            for (var j = 0; j < fillNodes.length; j++) {
              fillNodes[j].setAttribute("fill", color);
            }
            var strokeNodes = nested.querySelectorAll('[stroke="currentColor"]');
            for (var j = 0; j < strokeNodes.length; j++) {
              strokeNodes[j].setAttribute("stroke", color);
            }
            // Strip inherited opacity attributes so cloned content from a
            // label span that had fill-opacity/stroke-opacity CSS doesn't
            // render translucent. The nested SVG starts opaque.
            var opacityNodes = nested.querySelectorAll("[fill-opacity],[stroke-opacity]");
            for (var j = 0; j < opacityNodes.length; j++) {
              opacityNodes[j].removeAttribute("fill-opacity");
              opacityNodes[j].removeAttribute("stroke-opacity");
            }
            out.appendChild(nested);

          } else if (!mjxSvg) {  // plain-text/HTML label (not math/latex)
            var labelRect = label.getBoundingClientRect();
            var innerHTML = label.innerHTML || "";
            var hasHtml = /<[a-z][\s\S]*>/i.test(innerHTML.trim());
            var cssTransform = label.style.transform || "";
            var hasTransform = cssTransform && cssTransform !== "none";
            if (hasHtml || hasTransform) {
              // Satori placeholder: main app converts HTML to SVG paths via satori.
              var placeholder = document.createElementNS(NS, "g");
              placeholder.setAttribute("class", "satori-label");
              placeholder.setAttribute("data-html", innerHTML);
              placeholder.setAttribute("data-x", (labelRect.left - graphieRect.left) / sx);
              placeholder.setAttribute("data-y", (labelRect.top - graphieRect.top) / sy);
              placeholder.setAttribute("data-width", Math.max(labelRect.width / sx, 1));
              placeholder.setAttribute("data-height", Math.max(labelRect.height / sy, 1));
              placeholder.setAttribute("data-font-size", parseFloat(cs.fontSize) / sx);
              placeholder.setAttribute("data-font-family", cs.fontFamily);
              placeholder.setAttribute("data-fill", color);
              placeholder.setAttribute("data-transform", cssTransform);
              if (window.__satoriDebug) {
                console.log("[getSVG] satori-label placeholder", {
                  html: innerHTML,
                  x: (labelRect.left - graphieRect.left) / sx,
                  y: (labelRect.top - graphieRect.top) / sy,
                  width: Math.max(labelRect.width / sx, 1),
                  height: Math.max(labelRect.height / sy, 1),
                  fontSize: parseFloat(cs.fontSize) / sx,
                  fontFamily: cs.fontFamily,
                  fill: color,
                  transform: cssTransform
                });
              }
              out.appendChild(placeholder);
            } else {
              var text = document.createElementNS(NS, "text");
              text.setAttribute("x", (labelRect.left - graphieRect.left + labelRect.width / 2) / sx);
              text.setAttribute("y", (labelRect.top - graphieRect.top + labelRect.height / 2) / sy);
              text.setAttribute("text-anchor", "middle");
              text.setAttribute("dy", "0.35em");
              text.setAttribute("font-family", cs.fontFamily);
              text.setAttribute("font-size", parseFloat(cs.fontSize) / sx);
              text.setAttribute("fill", color);
              text.textContent = label.textContent.trim();
              out.appendChild(text);
            }
          }
          // else: placeholder svg, math not rendered yet — skipped
        }

        // Guard: any <svg> in the output lacking width/height silently becomes 100%
        // exactly the giant-glyph bug. Fail loudly instead.
        var svgs = [out].concat(Array.prototype.slice.call(out.querySelectorAll("svg")));
        for (var i = 0; i < svgs.length; i++) {
          if (!svgs[i].getAttribute("width") || !svgs[i].getAttribute("height")) {
            if (window.console) console.warn("graphie export: <svg> without width/height");
          }
        }

        // Use XMLSerializer for proper SVG serialization (handles namespaces)
        var serializer = new XMLSerializer();
        return serializer.serializeToString(out);
      };

      // Readiness: the AMD modules are loaded, but MathJax's startup
      // (which loads the SVG font data that tex2svg needs) is async.
      // Track both signals; only tell the parent we're ready — and only
      // render — once both are set, so katex.render() never runs before
      // the MathJax font is available.
      window.__graphieReady = true;

      function checkReady() {
        if (window.__graphieReady && window.__mathjaxReady) {
          window.dispatchEvent(new Event("graphie-ready"));
          postToParent({ type: "graphie:ready" });
          // Render any code that arrived before we were ready.
          if (window.__graphieCode) {
            var code = window.__graphieCode;
            window.__graphieCode = null;
            window.runGraphie(code);
          }
        }
      }

      // The MathJax adapter dispatches "mathjax-ready" once its
      // startup promise resolves.
      window.addEventListener("mathjax-ready", checkReady);
      // In case MathJax already started before the modules loaded.
      checkReady();

      // Message bridge: the parent (React) drives the iframe via postMessage.
      // Supported inbound messages:
      //   {type: "graphie:run", code: string}  -> render code, post result
      //   {type: "graphie:getSVG"}             -> post SVG back
      window.addEventListener("message", function (ev) {
        // Only the embedding window may drive the runtime.
        if (ev.source !== window.parent) return;
        var data = ev.data;
        if (!data || typeof data.type !== "string") return;
        if (data.type === "graphie:run") {
          // Wait for MathJax so tex2svg has its font data.
          if (window.__mathjaxReady) {
            window.runGraphie(data.code || "");
          } else {
            window.__graphieCode = data.code || "";
          }
         } else if (data.type === "graphie:zoom") {
           window.setZoom(data.zoom);
         } else if (data.type === "graphie:pan") {
           window.pan(data.dx, data.dy);
         } else if (data.type === "graphie:resetView") {
           window.resetView();
         } else if (data.type === "graphie:getSVG") {
          try {
            var svg = window.getSVG();
            postToParent({ type: "graphie:svg", svg: svg });
          } catch (e) {
            postToParent({
              type: "graphie:error",
              message: String(e && e.message ? e.message : e),
            });
          }
        }
      });
    });
  </script>
</body>
</html>
