[package]
name = "graphie-builder"
version = "0.1.0"
description = "A cross-platform desktop app for creating professional mathematical and scientific diagrams."
authors = ["Graphie Builder Contributors"]
edition = "2021"

[lib]
name = "graphie_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = [] }
tauri-plugin-clipboard = { version = "2.2.0", features = ["image-png"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]