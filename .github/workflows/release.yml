name: Build desktop apps

# Builds Graphie Builder for macOS (arm64 + x86_64), Linux (x86_64) and
# Windows (x86_64). Pushing a `v*` tag publishes a GitHub release with the
# installers; manual runs just build the artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (only used for workflow_dispatch)"
        required: false
        type: string

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            bundles: "app,dmg"
          - platform: macos-13
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            bundles: "app,dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            bundles: "deb,appimage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            bundles: "msi,nsis"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Yarn
        uses: taiki-e/install-action@v2
        with:
          tool: yarn

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Graphie Builder ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --bundles ${{ matrix.bundles }}
