name: Build Electron Apps

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (only used for workflow_dispatch)"
        required: false
        type: string

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web
        run: yarn build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

  build-electron:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-latest
            arch: universal
            artifact_name: mac-universal
          - os: macos-latest
            arch: arm64
            artifact_name: mac-arm64
          - os: macos-13
            arch: x64
            artifact_name: mac-x64
          # Windows
          - os: windows-latest
            arch: x64
            artifact_name: windows-x64
          # Linux x86_64
          - os: ubuntu-22.04
            arch: x64
            artifact_name: linux-x64
          # Linux ARM64
          - os: ubuntu-22.04
            arch: arm64
            artifact_name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist/

      - name: Setup Python (for node-gyp on some systems)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libasound2-dev \
            libxtst6 \
            xauth \
            xvfb \
            rpm \
            fakeroot \
            dpkg \
            libfuse2 \
            libarchive-tools \
            snapd

      - name: Set up QEMU for ARM64 builds on Linux
        if: matrix.os == 'ubuntu-22.04' && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            if [ "${{ matrix.arch }}" = "universal" ]; then
              npx electron-builder --mac --universal --publish never
            elif [ "${{ matrix.arch }}" = "arm64" ]; then
              npx electron-builder --mac --arm64 --publish never
            fi
          elif [ "${{ matrix.os }}" = "macos-13" ]; then
            npx electron-builder --mac --x64 --publish never
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win --x64 --publish never
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            if [ "${{ matrix.arch }}" = "x64" ]; then
              npx electron-builder --linux --x64 --publish never
            elif [ "${{ matrix.arch }}" = "arm64" ]; then
              npx electron-builder --linux --arm64 --publish never
            fi
          fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.artifact_name }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.exe
            release/**/*.msi
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.tar.gz
            release/**/*.pacman
            release/**/*.snap
            release/**/*.pkg.tar.xz
          retention-days: 30

  release:
    name: Create Release
    needs: [build-web, build-electron]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Graphie Builder ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
