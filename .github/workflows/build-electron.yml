name: Build Electron Apps

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (only used for workflow_dispatch)"
        required: false
        type: string

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web
        run: yarn build

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

  build-electron:
    name: ${{ matrix.os }}
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --universal
          - os: windows-latest
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          yarn --version
        shell: bash

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist/

      - name: Setup Python (for node-gyp on some systems)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libasound2-dev \
            libxtst6 \
            xauth \
            xvfb \
            rpm \
            fakeroot \
            dpkg \
            libfuse2 \
            libarchive-tools

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder ${{ matrix.args }} --publish always
        shell: bash
      
    
      - name: Zip release directory
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          filename: 'electron-${{ matrix.os }}.zip'
          path: 'release/*'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}.zip
          path: |
            electron-${{ matrix.os }}.zip
          retention-days: 30

  release:
    name: Create Release
    needs: [build-web, build-electron]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Unzip artifacts
        run: |
          echo "Unzipping artifacts..."

          # Ensure the temp directory exists
          mkdir -p "artifacts-tmp"

          # Safe loop handling for spaces or special characters
          for file in artifacts/*.zip; do
            # Double-check the file actually exists before trying to unzip it
            if [ -f "$file" ]; then
              echo "Extracting $file..."
              unzip -q "$file" -d "artifacts-tmp/"
              # Delete the zip immediately after a successful unzip to avoid state issues
              rm "$file"
            fi
          done

          # Ensure artifacts directory is ready and empty
          rm -rf artifacts
          mkdir -p artifacts

          # Move matched files out of temp
          if [ -d "artifacts-tmp" ]; then
            find artifacts-tmp/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.appimage" -o -name "*.dmg" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} artifacts/ \;
            rm -rf artifacts-tmp/
          fi

          echo "Files to upload:"
          ls -1 artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Graphie Builder ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
